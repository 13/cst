# test config (oh-my-tmux style)
set -g prefix2 C-a                        # GNU-Screen compatible prefix
bind C-a send-prefix -2
bind - split-window -v
bind _ split-window -h -c '#{pane_current_path}'
bind -r h select-pane -L  # move left
unbind n
bind -r C-S-H swap-window -t -1 \; select-window -t -1
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history
bind -N "Reload the config" r source-file ~/.tmux.conf
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -n MouseDown1Pane select-pane
bind \; last-pane
bind m set -gF mouse '#{?mouse,off,on}' \
  \; display "mouse toggled"
source-file -q extra.conf
if -b 'command -v xsel' 'bind y run "xsel"'
